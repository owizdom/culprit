name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          uv sync
          uv run pytest -q
      - name: Build and install the culprit command
        shell: bash
        run: |
          uv build --wheel
          uv run --no-project --with dist/*.whl python -c "import culprit, paths, app.window, app.tools, sim.icarus; print('culprit imports on', __import__('sys').platform)"

  # A real investigation on every OS: reproduce, rule out, confirm, repair and propagation on two known regressions,
  # with Icarus Verilog and Yosys. No model and no GitHub/Linear/Slack; the stock firmware ships in sim/fw-seed, so
  # no Docker or RISC-V toolchain is needed (Windows runners cannot run Linux containers).
  investigate:
    name: investigate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - shell: bash
          # Git Bash's bin\bash.exe puts Git's mingw64\bin ahead of PATH (git-wrapper.c setup_environment), so yosys
          # loads Git's DLLs instead of the suite's lib and exits 0xC0000139. PowerShell keeps the suite first, as
          # for a Windows user running culprit.
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OSS_CAD_SUITE: "2026-09-13"
      PICORV32_CI_SHA: 29016cc82233b9262539dec0f2b4ba5545276e83
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Install Icarus Verilog and Yosys (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q iverilog yosys
      - name: Install Icarus Verilog and Yosys (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install icarus-verilog yosys
      - name: Cache OSS CAD Suite (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/oss-cad-suite.tgz
          key: oss-cad-suite-windows-x64-${{ env.OSS_CAD_SUITE }}
      - name: Install OSS CAD Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP "oss-cad-suite.tgz"
          if (-not (Test-Path $archive)) {
            $date = $env:OSS_CAD_SUITE -replace '-', ''
            curl.exe -fsSL --retry 3 -o $archive "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$env:OSS_CAD_SUITE/oss-cad-suite-windows-x64-$date.tgz"
          }
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $env:RUNNER_TEMP
          $root = Join-Path $env:RUNNER_TEMP "oss-cad-suite"
          # What environment.bat does for these tools: executables in bin, DLLs (and lib/ivl) in lib.
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root "bin")
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root "lib")

      - name: Check out the picorv32-ci base design
        run: |
          git clone -q https://github.com/owizdom/picorv32-ci base
          git -C base checkout -q ${{ env.PICORV32_CI_SHA }}
          git -C base rev-parse HEAD

      # smoke.py first runs iverilog, vvp and yosys the way CULPRIT calls them and stops if one does not start.
      - name: Investigate real regressions (t01, upstream u-2cab981)
        run: |
          uv sync
          uv run python evals/smoke.py base
