- id: m07
  category: multi_hunk
  title: "decoder: annotate immediate formats; rename pcpi timeout counter"
  body: "Adds bit-layout comments to the immediate decode and renames pcpi_timeout_counter to pcpi_timeout_cnt to match the other short counter names."
  edits:
    - path: picorv32.v
      find: |
        				is_sb_sh_sw:
        					decoded_imm <= $signed({mem_rdata_q[31:25], mem_rdata_q[11:7]});
      replace: |
        				is_sb_sh_sw:
        					// S-type: imm[11:5] = insn[31:25], imm[4:0] = insn[11:7]
        					decoded_imm <= $signed({mem_rdata_q[31:25], mem_rdata_q[12:8]});
    - path: picorv32.v
      find: |
        	reg [3:0] pcpi_timeout_counter;
      replace: |
        	reg [3:0] pcpi_timeout_cnt;
    - path: picorv32.v
      find: |
        				if (pcpi_timeout_counter)
        					pcpi_timeout_counter <= pcpi_timeout_counter - 1;
        			end else
        				pcpi_timeout_counter <= ~0;
        			pcpi_timeout <= !pcpi_timeout_counter;
      replace: |
        				if (pcpi_timeout_cnt)
        					pcpi_timeout_cnt <= pcpi_timeout_cnt - 1;
        			end else
        				pcpi_timeout_cnt <= ~0;
        			pcpi_timeout <= !pcpi_timeout_cnt;
  truth:
    bug_contains: "mem_rdata_q[12:8]"
    fix_line: "\t\t\t\t\tdecoded_imm <= $signed({mem_rdata_q[31:25], mem_rdata_q[11:7]});"
    intended_contains: ["pcpi_timeout_cnt", "// S-type: imm[11:5] = insn[31:25]"]

- id: m08
  category: multi_hunk
  title: "decoder: document compressed jump offset layout"
  body: "Reflows the C.J/C.JAL offset shuffle with a comment giving the RVC bit order, puts the fetch-state latch clears in declaration order, and notes the rvfi rs1/rs2 address gating."
  edits:
    - path: picorv32.v
      find: |
        				{ decoded_imm_j[31:11], decoded_imm_j[4], decoded_imm_j[9:8], decoded_imm_j[10], decoded_imm_j[6],
        				  decoded_imm_j[7], decoded_imm_j[3:1], decoded_imm_j[5], decoded_imm_j[0] } <= $signed({mem_rdata_latched[12:2], 1'b0});
      replace: |
        				// C.J / C.JAL: insn[12:2] holds offset bits [11|4|9:8|10|6|7|3:1|5]
        				{ decoded_imm_j[31:11], decoded_imm_j[4], decoded_imm_j[9:8], decoded_imm_j[10],
        				  decoded_imm_j[7], decoded_imm_j[6], decoded_imm_j[3:1], decoded_imm_j[5], decoded_imm_j[0] } <= $signed({mem_rdata_latched[12:2], 1'b0});
    - path: picorv32.v
      find: |
        				latched_store <= 0;
        				latched_stalu <= 0;
        				latched_branch <= 0;
        				latched_is_lu <= 0;
      replace: |
        				latched_store <= 0;
        				latched_branch <= 0;
        				latched_stalu <= 0;
        				latched_is_lu <= 0;
    - path: picorv32.v
      find: |
        		rvfi_rs1_addr <= dbg_rs1val_valid ? dbg_insn_rs1 : 0;
        		rvfi_rs2_addr <= dbg_rs2val_valid ? dbg_insn_rs2 : 0;
      replace: |
        		// rs1/rs2 addresses are only reported for instructions that actually read them
        		rvfi_rs1_addr <= dbg_rs1val_valid ? dbg_insn_rs1 : 0;
        		rvfi_rs2_addr <= dbg_rs2val_valid ? dbg_insn_rs2 : 0;
  truth:
    bug_contains: "decoded_imm_j[7], decoded_imm_j[6]"
    fix_line: "\t\t\t\t  decoded_imm_j[6], decoded_imm_j[7], decoded_imm_j[3:1], decoded_imm_j[5], decoded_imm_j[0] } <= $signed({mem_rdata_latched[12:2], 1'b0});"
    intended_contains: ["C.J / C.JAL: insn[12:2] holds offset bits"]

