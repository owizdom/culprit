# CULPRIT evaluation corpus. Each case is a set of exact-text edits to the PicoRV32 checkout at ef203c2.
# Ground truth lives here and in cases/<id>/truth.json; the agent never reads either.

- id: a01
  category: bug_in_intended_edit
  title: "ALU: group the single-cycle comparators"
  body: "Readability pass on the non-TWO_CYCLE_ALU block: arithmetic and shifts first, then the three comparators under one comment, with the signed/unsigned intent spelled out. No functional change intended."
  edits:
    - path: picorv32.v
      find: |
        			alu_add_sub = instr_sub ? reg_op1 - reg_op2 : reg_op1 + reg_op2;
        			alu_eq = reg_op1 == reg_op2;
        			alu_lts = $signed(reg_op1) < $signed(reg_op2);
        			alu_ltu = reg_op1 < reg_op2;
        			alu_shl = reg_op1 << reg_op2[4:0];
        			alu_shr = $signed({instr_sra || instr_srai ? reg_op1[31] : 1'b0, reg_op1}) >>> reg_op2[4:0];
      replace: |
        			alu_add_sub = instr_sub ? reg_op1 - reg_op2 : reg_op1 + reg_op2;
        			alu_shl = reg_op1 << reg_op2[4:0];
        			alu_shr = $signed({instr_sra || instr_srai ? reg_op1[31] : 1'b0, reg_op1}) >>> reg_op2[4:0];

        			// comparators: equality, signed less-than, unsigned less-than
        			alu_eq = reg_op1 == reg_op2;
        			alu_lts = $signed(reg_op1) < reg_op2;
        			alu_ltu = $unsigned(reg_op1) < $unsigned(reg_op2);
  truth:
    bug_contains: "alu_lts = $signed(reg_op1) < reg_op2;"
    fix_line: "\t\t\talu_lts = $signed(reg_op1) < $signed(reg_op2);"
    intended_contains: ["alu_ltu = $unsigned(reg_op1) < $unsigned(reg_op2);", "// comparators: equality, signed less-than, unsigned less-than"]

- id: a02
  category: bug_in_intended_edit
  title: "mem: replace narrow-read case tables with indexed part-selects"
  body: "The byte and halfword read muxes in the look-ahead always block were written as explicit case tables. Collapse them into one indexed part-select each; same behaviour, fewer lines to keep in sync with the strobe logic."
  edits:
    - path: picorv32.v
      find: |
        			1: begin
        				mem_la_wdata = {2{reg_op2[15:0]}};
        				mem_la_wstrb = reg_op1[1] ? 4'b1100 : 4'b0011;
        				case (reg_op1[1])
        					1'b0: mem_rdata_word = {16'b0, mem_rdata[15: 0]};
        					1'b1: mem_rdata_word = {16'b0, mem_rdata[31:16]};
        				endcase
        			end
        			2: begin
        				mem_la_wdata = {4{reg_op2[7:0]}};
        				mem_la_wstrb = 4'b0001 << reg_op1[1:0];
        				case (reg_op1[1:0])
        					2'b00: mem_rdata_word = {24'b0, mem_rdata[ 7: 0]};
        					2'b01: mem_rdata_word = {24'b0, mem_rdata[15: 8]};
        					2'b10: mem_rdata_word = {24'b0, mem_rdata[23:16]};
        					2'b11: mem_rdata_word = {24'b0, mem_rdata[31:24]};
        				endcase
        			end
      replace: |
        			1: begin
        				mem_la_wdata = {2{reg_op2[15:0]}};
        				mem_la_wstrb = reg_op1[1] ? 4'b1100 : 4'b0011;
        				mem_rdata_word = {16'b0, mem_rdata[{reg_op1[1], 3'b000} +: 16]};
        			end
        			2: begin
        				mem_la_wdata = {4{reg_op2[7:0]}};
        				mem_la_wstrb = 4'b0001 << reg_op1[1:0];
        				mem_rdata_word = {24'b0, mem_rdata[{reg_op1[1:0], 3'b000} +: 8]};
        			end
  truth:
    bug_contains: "mem_rdata[{reg_op1[1], 3'b000} +: 16]"
    fix_line: "\t\t\t\tmem_rdata_word = {16'b0, mem_rdata[{reg_op1[1], 4'b0000} +: 16]};"
    intended_contains: ["mem_rdata_word = {24'b0, mem_rdata[{reg_op1[1:0], 3'b000} +: 8]};"]

- id: a03
  category: bug_in_intended_edit
  title: "ldmem: make load sign extension explicit"
  body: "Some downstream synthesis flows we use mishandle $signed() on part-selects inside case items. Spell out the sign extension for lh/lb with replication instead. Pure rewrite of the same logic."
  edits:
    - path: picorv32.v
      find: |
        							latched_is_lu: reg_out <= mem_rdata_word;
        							latched_is_lh: reg_out <= $signed(mem_rdata_word[15:0]);
        							latched_is_lb: reg_out <= $signed(mem_rdata_word[7:0]);
      replace: |
        							// sign-extend narrow loads explicitly instead of relying on $signed()
        							latched_is_lu: reg_out <= mem_rdata_word;
        							latched_is_lh: reg_out <= {{16{mem_rdata_word[15]}}, mem_rdata_word[15:0]};
        							latched_is_lb: reg_out <= {{24{mem_rdata_word[8]}}, mem_rdata_word[7:0]};
  truth:
    bug_contains: "{{24{mem_rdata_word[8]}}"
    fix_line: "\t\t\t\t\t\t\tlatched_is_lb: reg_out <= {{24{mem_rdata_word[7]}}, mem_rdata_word[7:0]};"
    intended_contains: ["latched_is_lh: reg_out <= {{16{mem_rdata_word[15]}}, mem_rdata_word[15:0]};"]

- id: a04
  category: bug_in_intended_edit
  title: "irq: document which q-register each IRQ entry step writes"
  body: "Adds a comment for the two-step IRQ entry (q0 gets the return address, q1 the pending mask) and writes the q-register index as offset + step in both the QREGS and non-QREGS branches so they read the same way."
  edits:
    - path: picorv32.v
      find: |
        					if (ENABLE_IRQ_QREGS)
        						latched_rd <= irqregs_offset | irq_state[0];
        					else
        						latched_rd <= irq_state[0] ? 4 : 3;
      replace: |
        					// q0 (return address) is written in irq_state 2'b01, q1 (pending IRQs) in 2'b10
        					if (ENABLE_IRQ_QREGS)
        						latched_rd <= irqregs_offset + irq_state[1];
        					else
        						latched_rd <= 3 + irq_state[0];
  truth:
    bug_contains: "latched_rd <= irqregs_offset + irq_state[1];"
    fix_line: "\t\t\t\t\t\tlatched_rd <= irqregs_offset + irq_state[0];"
    intended_contains: ["latched_rd <= 3 + irq_state[0];", "// q0 (return address) is written in irq_state 2'b01, q1 (pending IRQs) in 2'b10"]

- id: a05
  category: bug_in_intended_edit
  title: "pcpi_mul: document operand signedness per opcode"
  body: "Adds the MUL/MULH/MULHSU/MULHU signedness table above the decode wires and drops the single-element reduction-OR on instr_rs2_signed. No logic change."
  edits:
    - path: picorv32.v
      find: |
        	wire instr_any_mul = |{instr_mul, instr_mulh, instr_mulhsu, instr_mulhu};
        	wire instr_any_mulh = |{instr_mulh, instr_mulhsu, instr_mulhu};
        	wire instr_rs1_signed = |{instr_mulh, instr_mulhsu};
        	wire instr_rs2_signed = |{instr_mulh};

        	reg pcpi_wait_q;
      replace: |
        	// Operand signedness: MULH is signed x signed, MULHSU is signed x unsigned, MULHU and MUL are unsigned.
        	wire instr_any_mul = |{instr_mul, instr_mulh, instr_mulhsu, instr_mulhu};
        	wire instr_any_mulh = |{instr_mulh, instr_mulhsu, instr_mulhu};
        	wire instr_rs1_signed = |{instr_mulh, instr_mulhu};
        	wire instr_rs2_signed = instr_mulh;

        	reg pcpi_wait_q;
  truth:
    bug_contains: "instr_rs1_signed = |{instr_mulh, instr_mulhu};"
    fix_line: "\twire instr_rs1_signed = |{instr_mulh, instr_mulhsu};"
    intended_contains: ["wire instr_rs2_signed = instr_mulh;", "// Operand signedness: MULH is signed x signed"]

- id: a06
  category: bug_in_intended_edit
  title: "pcpi_div: normalise operand sign handling on start"
  body: "Puts the sign bit first in the dividend/divisor negation conditions and replaces the reduction-OR divide-by-zero test with an explicit compare. Lint was flagging |pcpi_rs2 in a boolean context."
  edits:
    - path: picorv32.v
      find: |
        			dividend <= (instr_div || instr_rem) && pcpi_rs1[31] ? -pcpi_rs1 : pcpi_rs1;
        			divisor <= ((instr_div || instr_rem) && pcpi_rs2[31] ? -pcpi_rs2 : pcpi_rs2) << 31;
        			outsign <= (instr_div && (pcpi_rs1[31] != pcpi_rs2[31]) && |pcpi_rs2) || (instr_rem && pcpi_rs1[31]);
      replace: |
        			dividend <= pcpi_rs1[31] && (instr_div || instr_rem) ? -pcpi_rs1 : pcpi_rs1;
        			divisor <= (pcpi_rs2[31] && (instr_div || instr_rem) ? -pcpi_rs2 : pcpi_rs2) << 31;
        			outsign <= (instr_div && (pcpi_rs1[31] != pcpi_rs2[31]) && pcpi_rs2 != 0) || (instr_rem && pcpi_rs2[31]);
  truth:
    bug_contains: "(instr_rem && pcpi_rs2[31])"
    fix_line: "\t\t\toutsign <= (instr_div && (pcpi_rs1[31] != pcpi_rs2[31]) && pcpi_rs2 != 0) || (instr_rem && pcpi_rs1[31]);"
    intended_contains: ["pcpi_rs2 != 0", "dividend <= pcpi_rs1[31] && (instr_div || instr_rem) ? -pcpi_rs1 : pcpi_rs1;"]

- id: a07
  category: bug_in_intended_edit
  title: "pcpi: build the internal wait/ready OR one co-processor per line"
  body: "The internal PCPI handshake was two long reduction-ORs that are hard to diff when a co-processor is added. Accumulate wait and ready one enabled core per line instead; same logic."
  edits:
    - path: picorv32.v
      find: |
        		pcpi_int_wait  = |{ENABLE_PCPI && pcpi_wait,  (ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_wait,  ENABLE_DIV && pcpi_div_wait};
        		pcpi_int_ready = |{ENABLE_PCPI && pcpi_ready, (ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_ready, ENABLE_DIV && pcpi_div_ready};
      replace: |
        		// OR together the handshake of every enabled co-processor
        		pcpi_int_wait  = ENABLE_PCPI && pcpi_wait;
        		pcpi_int_wait  = pcpi_int_wait  || ((ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_wait);
        		pcpi_int_wait  = pcpi_int_wait  || (ENABLE_DIV && pcpi_div_ready);
        		pcpi_int_ready = ENABLE_PCPI && pcpi_ready;
        		pcpi_int_ready = pcpi_int_ready || ((ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_ready);
        		pcpi_int_ready = pcpi_int_ready || (ENABLE_DIV && pcpi_div_ready);
  truth:
    bug_contains: "pcpi_int_wait  || (ENABLE_DIV && pcpi_div_ready);"
    fix_line: "\t\tpcpi_int_wait  = pcpi_int_wait  || (ENABLE_DIV && pcpi_div_wait);"
    intended_contains: ["pcpi_int_ready = pcpi_int_ready || (ENABLE_DIV && pcpi_div_ready);", "pcpi_int_wait  = pcpi_int_wait  || ((ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_wait);"]

- id: a08
  category: bug_in_intended_edit
  title: "decoder: give ALU immediates their own decoded_imm item"
  body: "Splits is_alu_reg_imm out of the shared I-type immediate item so the ALU immediate path can be special-cased for shift amounts in a follow-up. jalr and loads keep the existing item."
  edits:
    - path: picorv32.v
      find: |
        				|{instr_jalr, is_lb_lh_lw_lbu_lhu, is_alu_reg_imm}:
        					decoded_imm <= $signed(mem_rdata_q[31:20]);
      replace: |
        				|{instr_jalr, is_lb_lh_lw_lbu_lhu}:
        					decoded_imm <= $signed(mem_rdata_q[31:20]);
        				is_alu_reg_imm:
        					decoded_imm <= $signed(mem_rdata_q[31:21]);
  truth:
    bug_contains: "decoded_imm <= $signed(mem_rdata_q[31:21]);"
    fix_line: "\t\t\t\t\tdecoded_imm <= $signed(mem_rdata_q[31:20]);"
    intended_contains: ["|{instr_jalr, is_lb_lh_lw_lbu_lhu}:"]

- id: a09
  category: bug_in_intended_edit
  title: "alu: give blt/bltu explicit branch-condition items"
  body: "blt and bltu currently reach alu_out_0 through the shared slt/sltu items, which need the TWO_CYCLE_COMPARE guard. Add explicit one-line items next to bge/bgeu so all six branch conditions are listed together."
  edits:
    - path: picorv32.v
      find: |
        			instr_bgeu:
        				alu_out_0 = !alu_ltu;
      replace: |
        			instr_bgeu:
        				alu_out_0 = !alu_ltu;
        			instr_blt:  alu_out_0 = alu_lts;
        			instr_bltu: alu_out_0 = alu_lts;
  truth:
    bug_contains: "instr_bltu: alu_out_0 = alu_lts;"
    fix_line: "\t\t\tinstr_bltu: alu_out_0 = alu_ltu;"
    intended_contains: ["instr_blt:  alu_out_0 = alu_lts;"]

- id: a10
  category: bug_in_intended_edit
  title: "shift: add an 8-bit stage to the sequential shifter"
  body: "Large shift amounts spend up to 10 cycles in cpu_state_shift. Add an 8-bit step ahead of the existing 4-bit step when TWO_STAGE_SHIFT is set; results are unchanged, shifts by 8+ finish sooner."
  edits:
    - path: picorv32.v
      find: |
        				end else if (TWO_STAGE_SHIFT && reg_sh >= 4) begin
      replace: |
        				end else if (TWO_STAGE_SHIFT && reg_sh >= 8) begin
        					(* parallel_case, full_case *)
        					case (1'b1)
        						instr_slli || instr_sll: reg_op1 <= reg_op1 << 8;
        						instr_srli || instr_srl: reg_op1 <= reg_op1 >> 8;
        						instr_srai || instr_sra: reg_op1 <= reg_op1 >>> 8;
        					endcase
        					reg_sh <= reg_sh - 8;
        				end else if (TWO_STAGE_SHIFT && reg_sh >= 4) begin
  truth:
    bug_contains: "reg_op1 <= reg_op1 >>> 8;"
    fix_line: "\t\t\t\t\t\tinstr_srai || instr_sra: reg_op1 <= $signed(reg_op1) >>> 8;"
    intended_contains: ["TWO_STAGE_SHIFT && reg_sh >= 8", "reg_sh <= reg_sh - 8;"]

- id: m01
  category: multi_hunk
  title: "decoder: document funct3 encodings"
  body: "Adds a short funct3 reference next to the instruction decoder and annotates the RVFI mode/ixl constants. While in there I re-checked the conditional branch decode table against the spec."
  edits:
    - path: picorv32.v
      find: |
        	// Instruction Decoder

        	reg instr_lui, instr_auipc, instr_jal, instr_jalr;
      replace: |
        	// Instruction Decoder
        	//
        	// funct3 values follow the RV32I base opcode map. Branches: 000 beq, 001 bne, 100 blt,
        	// 101 bge, 110 bltu, 111 bgeu. Loads/stores: 000 byte, 001 half, 010 word (1xx = unsigned load).

        	reg instr_lui, instr_auipc, instr_jal, instr_jalr;
    - path: picorv32.v
      find: |
        			instr_bgeu  <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdata_q[14:12] == 3'b111;
      replace: |
        			instr_bgeu  <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdata_q[14:12] == 3'b011;
    - path: picorv32.v
      find: |
        		rvfi_mode <= 3;
        		rvfi_ixl <= 1;
      replace: |
        		rvfi_mode <= 3; // machine mode
        		rvfi_ixl <= 1;  // XLEN = 32
  truth:
    bug_contains: "instr_bgeu  <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdata_q[14:12] == 3'b011;"
    fix_line: "\t\t\tinstr_bgeu  <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdata_q[14:12] == 3'b111;"
    intended_contains: ["// funct3 values follow the RV32I base opcode map", "rvfi_mode <= 3; // machine mode"]

- id: m02
  category: multi_hunk
  title: "counters: decode rdinstret by CSR number, rename counter-read flag"
  body: "Rewrites the rdinstret/rdinstreth decode as explicit CSR number, rs1 and funct3 compares instead of one 20-bit magic constant, renames is_rdcycle_rdcycleh_rdinstr_rdinstrh to is_counter_read, and documents when each counter ticks."
  edits:
    - path: picorv32.v
      find: |-
        	wire is_rdcycle_rdcycleh_rdinstr_rdinstrh;
        	assign is_rdcycle_rdcycleh_rdinstr_rdinstrh = 
      replace: |-
        	wire is_counter_read;
        	assign is_counter_read = 
    - path: picorv32.v
      find: |
        			instr_rdinstr  <=  (mem_rdata_q[6:0] == 7'b1110011 && mem_rdata_q[31:12] == 'b11000000001000000010) && ENABLE_COUNTERS;
        			instr_rdinstrh <=  (mem_rdata_q[6:0] == 7'b1110011 && mem_rdata_q[31:12] == 'b11001000001000000010) && ENABLE_COUNTERS && ENABLE_COUNTERS64;
      replace: |
        			// rdinstret / rdinstreth: CSRRS with rs1 = x0 on CSR 0xC02 / 0xC82
        			instr_rdinstr  <=  (mem_rdata_q[6:0] == 7'b1110011 && mem_rdata_q[31:20] == 12'hc02 && mem_rdata_q[19:15] == 5'd0 && mem_rdata_q[14:12] == 3'b001) && ENABLE_COUNTERS;
        			instr_rdinstrh <=  (mem_rdata_q[6:0] == 7'b1110011 && mem_rdata_q[31:20] == 12'hc82 && mem_rdata_q[19:15] == 5'd0 && mem_rdata_q[14:12] == 3'b010) && ENABLE_COUNTERS && ENABLE_COUNTERS64;
    - path: picorv32.v
      find: |
        		if (ENABLE_COUNTERS) begin
        			count_cycle <= resetn ? count_cycle + 1 : 0;
      replace: |
        		// count_cycle ticks on every clock out of reset; count_instr is bumped per decoded instruction in cpu_state_fetch
        		if (ENABLE_COUNTERS) begin
        			count_cycle <= resetn ? count_cycle + 1 : 0;
    - path: picorv32.v
      find: "ENABLE_COUNTERS && is_rdcycle_rdcycleh_rdinstr_rdinstrh: begin"
      replace: "ENABLE_COUNTERS && is_counter_read: begin"
  truth:
    bug_contains: "mem_rdata_q[31:20] == 12'hc02"
    fix_line: "\t\t\tinstr_rdinstr  <=  (mem_rdata_q[6:0] == 7'b1110011 && mem_rdata_q[31:20] == 12'hc02 && mem_rdata_q[19:15] == 5'd0 && mem_rdata_q[14:12] == 3'b010) && ENABLE_COUNTERS;"
    intended_contains: ["is_counter_read", "mem_rdata_q[31:20] == 12'hc82"]

- id: m03
  category: multi_hunk
  title: "mem: small cleanups around look-ahead strobes and prefetch state"
  body: "Renames clear_prefetched_high_word_q to the _r suffix we use for plain registers, orders the trap/reset clears the same way as their declarations, and simplifies the halfword strobe select."
  edits:
    - path: picorv32.v
      find: |
        				mem_la_wstrb = reg_op1[1] ? 4'b1100 : 4'b0011;
      replace: |
        				mem_la_wstrb = reg_op1[0] ? 4'b1100 : 4'b0011;
    - path: picorv32.v
      find: |
        			mem_la_secondword <= 0;
        			prefetched_high_word <= 0;
        		end else begin
      replace: |
        			prefetched_high_word <= 0;
        			mem_la_secondword <= 0;
        		end else begin
    - path: picorv32.v
      find: |
        	reg clear_prefetched_high_word_q;
        	always @(posedge clk) clear_prefetched_high_word_q <= clear_prefetched_high_word;

        	always @* begin
        		clear_prefetched_high_word = clear_prefetched_high_word_q;
      replace: |
        	reg clear_prefetched_high_word_r;
        	always @(posedge clk) clear_prefetched_high_word_r <= clear_prefetched_high_word;

        	always @* begin
        		clear_prefetched_high_word = clear_prefetched_high_word_r;
  truth:
    bug_contains: "mem_la_wstrb = reg_op1[0] ? 4'b1100 : 4'b0011;"
    fix_line: "\t\t\t\tmem_la_wstrb = reg_op1[1] ? 4'b1100 : 4'b0011;"
    intended_contains: ["clear_prefetched_high_word_r"]

- id: m04
  category: multi_hunk
  title: "compressed decoder: comment the C.SUB/C.XOR/C.OR/C.AND funct3 map"
  body: "Documents the funct2 to funct3 mapping in the compressed pre-decoder and cross-references it from the second decode stage. Also labels the RVFI CSR observation ports."
  edits:
    - path: picorv32.v
      find: |
        								if (mem_rdata_latched[6:5] == 2'b00) mem_rdata_q[14:12] <= 3'b000;
        								if (mem_rdata_latched[6:5] == 2'b01) mem_rdata_q[14:12] <= 3'b100;
        								if (mem_rdata_latched[6:5] == 2'b10) mem_rdata_q[14:12] <= 3'b110;
        								if (mem_rdata_latched[6:5] == 2'b11) mem_rdata_q[14:12] <= 3'b111;
      replace: |
        								// funct2 (insn[6:5]) to funct3: 00 SUB->000, 01 XOR->100, 10 OR->110, 11 AND->111
        								if (mem_rdata_latched[6:5] == 2'b00) mem_rdata_q[14:12] <= 3'b000;
        								if (mem_rdata_latched[6:5] == 2'b01) mem_rdata_q[14:12] <= 3'b100;
        								if (mem_rdata_latched[6:5] == 2'b10) mem_rdata_q[14:12] <= 3'b111;
        								if (mem_rdata_latched[6:5] == 2'b11) mem_rdata_q[14:12] <= 3'b111;
    - path: picorv32.v
      find: |
        	output reg [63:0] rvfi_csr_mcycle_rmask,
      replace: |
        	// CSR observation (mcycle/minstret) for riscv-formal csr checks
        	output reg [63:0] rvfi_csr_mcycle_rmask,
    - path: picorv32.v
      find: |
        								if (mem_rdata_latched[12:10] == 3'b011) begin // C.SUB, C.XOR, C.OR, C.AND
        									is_alu_reg_reg <= 1;
      replace: |
        								if (mem_rdata_latched[12:10] == 3'b011) begin // C.SUB, C.XOR, C.OR, C.AND (funct3 comes from the pre-decoder)
        									is_alu_reg_reg <= 1;
  truth:
    bug_contains: "== 2'b10) mem_rdata_q[14:12] <= 3'b111;"
