- id: h01
  category: two_hunk
  title: "Tidy load/store width decode (native and compressed)"
  body: "Touches up the load width select in cpu_state_ldmem and the C.SWSP offset expansion in the compressed pre-decoder so both read like the neighbouring table entries."
  edits:
    - path: picorv32.v
      find: |
        							instr_lh || instr_lhu: mem_wordsize <= 1;
      replace: |
        							instr_lh || instr_lbu: mem_wordsize <= 1;
    - path: picorv32.v
      find: |
        							{mem_rdata_q[31:25], mem_rdata_q[11:7]} <= {4'b0, mem_rdata_latched[8:7], mem_rdata_latched[12:9], 2'b00};
      replace: |
        							{mem_rdata_q[31:25], mem_rdata_q[11:7]} <= {4'b0, mem_rdata_latched[8:7], mem_rdata_latched[11:8], 2'b00};
  truth:
