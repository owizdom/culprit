    fix_line: ["\t\t\t\t\t\t\tinstr_lh || instr_lhu: mem_wordsize <= 1;", "\t\t\t\t\t\t\t{mem_rdata_q[31:25], mem_rdata_q[11:7]} <= {4'b0, mem_rdata_latched[8:7], mem_rdata_latched[12:9], 2'b00};"]
    intended_contains: []

- id: h02
  category: two_hunk
  title: "Shifter and U-type operand cleanups"
  body: "Uses one arithmetic-shift form for the 4-bit right-shift stage and selects the lui/auipc first operand from the auipc flag, which reads more naturally next to the PC."
  edits:
    - path: picorv32.v
      find: |
        						instr_srli || instr_srl: reg_op1 <= reg_op1 >> 4;
      replace: |
        						instr_srli || instr_srl: reg_op1 <= $signed(reg_op1) >>> 4;
    - path: picorv32.v
      find: |
        						reg_op1 <= instr_lui ? 0 : reg_pc;
      replace: |
        						reg_op1 <= instr_auipc ? 0 : reg_pc;
  truth:
    bug_contains: ["instr_srli || instr_srl: reg_op1 <= $signed(reg_op1) >>> 4;", "reg_op1 <= instr_auipc ? 0 : reg_pc;"]
    fix_line: ["\t\t\t\t\t\tinstr_srli || instr_srl: reg_op1 <= reg_op1 >> 4;", "\t\t\t\t\t\treg_op1 <= instr_lui ? 0 : reg_pc;"]
    intended_contains: []

- id: h03
  category: two_hunk
  title: "Enable the barrel shifter in picorv32_axi"
  body: "Switches the AXI wrapper default to BARREL_SHIFTER = 1 (shifts complete in one exec cycle) and simplifies the arithmetic-right-shift fill select in the single-cycle ALU."
  edits:
    - path: picorv32.v
      find: |
        			alu_shr = $signed({instr_sra || instr_srai ? reg_op1[31] : 1'b0, reg_op1}) >>> reg_op2[4:0];
      replace: |
