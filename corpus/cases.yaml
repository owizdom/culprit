        	parameter [ 0:0] ENABLE_COUNTERS64 = 1,
        	parameter [ 0:0] ENABLE_REGS_16_31 = 1,
        	parameter [ 0:0] ENABLE_REGS_DUALPORT = 1,
        	parameter [ 0:0] TWO_STAGE_SHIFT = 1,
        	parameter [ 0:0] BARREL_SHIFTER = 0,
      replace: |
        module picorv32_axi #(
        	parameter [ 0:0] ENABLE_COUNTERS = 1,
        	parameter [ 0:0] ENABLE_COUNTERS64 = 1,
        	parameter [ 0:0] ENABLE_REGS_16_31 = 1,
        	parameter [ 0:0] ENABLE_REGS_DUALPORT = 1,
        	parameter [ 0:0] TWO_STAGE_SHIFT = 1,
        	parameter [ 0:0] BARREL_SHIFTER = 1,
  truth:
    bug_contains: ["alu_shr = $signed({instr_sra ? reg_op1[31]", "BARREL_SHIFTER = 1,"]
    fix_line: "\t\t\talu_shr = $signed({instr_sra || instr_srai ? reg_op1[31] : 1'b0, reg_op1}) >>> reg_op2[4:0];"
    intended_contains: ["BARREL_SHIFTER = 1,"]

- id: n01
  category: not_reproduced
  title: "mem: rename mem_16bit_buffer to mem_16bit_hold"
  body: "The register holds the upper half of a prefetched word across fetches; rename it so it is not confused with a FIFO, and describe it at the declaration."
  edits:
    - path: picorv32.v
      find: |
        	reg [15:0] mem_16bit_buffer;
      replace: |
        	// upper 16 bits of the last fetched word, reused when the next instruction starts at pc+2
        	reg [15:0] mem_16bit_hold;
    - path: picorv32.v
      find: |
        	assign mem_rdata_latched = COMPRESSED_ISA && mem_la_use_prefetched_high_word ? {16'bx, mem_16bit_buffer} :
        			COMPRESSED_ISA && mem_la_secondword ? {mem_rdata_latched_noshuffle[15:0], mem_16bit_buffer} :
      replace: |
        	assign mem_rdata_latched = COMPRESSED_ISA && mem_la_use_prefetched_high_word ? {16'bx, mem_16bit_hold} :
        			COMPRESSED_ISA && mem_la_secondword ? {mem_rdata_latched_noshuffle[15:0], mem_16bit_hold} :
    - path: picorv32.v
      find: |
        							if (!mem_la_use_prefetched_high_word)
        								mem_16bit_buffer <= mem_rdata[31:16];
      replace: |
        							if (!mem_la_use_prefetched_high_word)
        								mem_16bit_hold <= mem_rdata[31:16];
    - path: picorv32.v
      find: |
        									mem_16bit_buffer <= mem_rdata[31:16];
        									prefetched_high_word <= 1;
      replace: |
        									mem_16bit_hold <= mem_rdata[31:16];
        									prefetched_high_word <= 1;
  truth: {}

- id: n02
  category: not_reproduced
  title: "irq: simplify timer expiry compare"
  body: "timer - 1 == 0 under a timer != 0 guard is just timer == 1. Also groups the branch-flag resets and notes what the RVFI CSR block reports."
  edits:
    - path: picorv32.v
      find: |
        			if(ENABLE_IRQ_TIMER && timer)
        				if (timer - 1 == 0)
        					next_irq_pending[irq_timer] = 1;
      replace: |
        			// the timer IRQ fires on the cycle the down-counter goes from 1 to 0
        			if (ENABLE_IRQ_TIMER && timer == 1)
        				next_irq_pending[irq_timer] = 1;
    - path: picorv32.v
      find: |
        			instr_beq   <= 0;
        			instr_bne   <= 0;
        			instr_blt   <= 0;
        			instr_bge   <= 0;
        			instr_bltu  <= 0;
        			instr_bgeu  <= 0;
      replace: |
        			instr_bgeu  <= 0;
        			instr_bltu  <= 0;
        			instr_bge   <= 0;
        			instr_blt   <= 0;
        			instr_bne   <= 0;
        			instr_beq   <= 0;
    - path: picorv32.v
      find: |
        		if (rvfi_valid && rvfi_insn[6:0] == 7'b 1110011 && rvfi_insn[13:12] == 3'b010) begin
      replace: |
        		// counter reads (csrrs on 0xC00/0xC80/0xC02/0xC82) expose the value written to rd
        		if (rvfi_valid && rvfi_insn[6:0] == 7'b 1110011 && rvfi_insn[13:12] == 3'b010) begin
  truth: {}
