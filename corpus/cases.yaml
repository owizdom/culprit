- id: m05
  category: multi_hunk
  title: "irq: comment q0/q1 layout, tidy retirq"
  body: "Documents what lands in q0/q1 on IRQ entry, labels the RVFI IRQ bookkeeping registers, and tidies the retirq return-address masking."
  edits:
    - path: picorv32.v
      find: |
        				ENABLE_IRQ && irq_state[0]: begin
        					cpuregs_wrdata = reg_next_pc | latched_compr;
      replace: |
        				// IRQ entry: q0 <= return PC, LSB set if the interrupted instruction was compressed
        				ENABLE_IRQ && irq_state[0]: begin
        					cpuregs_wrdata = reg_next_pc | latched_compr;
    - path: picorv32.v
      find: |
        						reg_out <= CATCH_MISALIGN ? (cpuregs_rs1 & 32'h fffffffe) : cpuregs_rs1;
      replace: |
        						reg_out <= CATCH_MISALIGN ? (cpuregs_rs1 & 32'h fffffffc) : cpuregs_rs1;
    - path: picorv32.v
      find: |
        	reg dbg_irq_call;
        	reg dbg_irq_enter;
        	reg [31:0] dbg_irq_ret;
      replace: |
        	// dbg_irq_call/dbg_irq_enter track the instruction that takes an IRQ so rvfi_intr marks the first handler instruction
        	reg dbg_irq_call;
        	reg dbg_irq_enter;
        	reg [31:0] dbg_irq_ret;
  truth:
    bug_contains: "(cpuregs_rs1 & 32'h fffffffc)"
    fix_line: "\t\t\t\t\t\treg_out <= CATCH_MISALIGN ? (cpuregs_rs1 & 32'h fffffffe) : cpuregs_rs1;"
    intended_contains: ["// IRQ entry: q0 <= return PC"]

